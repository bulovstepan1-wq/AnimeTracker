name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack project
        run: |
          mkdir project
          unzip -q ./*.zip -d project
          ROOT=$(find project -name gradlew -type f -print -quit | xargs dirname)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x "$ROOT/gradlew"
          cd "$ROOT"
          bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTracker-debug
          path: "**/build/outputs/apk/debug/*.apk"
